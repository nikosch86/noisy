[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noisy"
version = "1.0.0"
description = "Generates random HTTP/DNS traffic noise in the background."
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.9"
authors = [{name = "Itay Hury"}]
dependencies = [
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "pip-tools>=7.4",
]

[project.scripts]
noisy = "noisy:main"

[tool.setuptools]
py-modules = ["noisy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["noisy"]

[tool.coverage.report]
show_missing = true
fail_under = 85
